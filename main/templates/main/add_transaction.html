{% extends "main/base.html" %}
{% block title %}Add Transaction{% endblock %}

{% block content %}
<h1>Add Transaction</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Transaction</button>
    <a href="{% url 'transaction_list' %}">Cancel</a>
</form>
{% endblock %}
